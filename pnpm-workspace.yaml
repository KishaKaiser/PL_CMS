packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  sharp: true
# Security fixes for packages that other packages (NestJS 10, Next.js) pull in at a vulnerable version. Each rule only
# touches the vulnerable range, so nothing newer is pulled back.
overrides:
  '@ungap/structured-clone': ^1.3.1
  'body-parser@<1.20.9': ^1.20.9
  'path-to-regexp@<0.1.13': ^0.1.13
  'proxy-addr@<2.0.8': ^2.0.8
  'engine.io@<6.6.10': ^6.6.11
  'socket.io-parser@<4.2.7': ^4.2.7
  'ws@>=8.0.0 <8.21.0': ^8.22.1
  'qs@<6.16.1': ^6.17.1
  'lodash@<4.17.24': ^4.17.24
  'nanoid@<3.3.18': ^3.3.20
  'postcss@<8.5.23': ^8.5.32
  'sharp@<0.35.5': ^0.35.5
  'source-map-js@<1.2.2': ^1.2.2
  'uuid@<11.1.1': ^11.1.1
  'fflate@<0.8.3': ^0.8.3
  'file-type@<21.3.2': ^21.3.2
  'multer@<2.5.0': ^2.5.0
  # Build and lint tooling only (never part of the running site): newest version within the same major.
  'glob@>=10.0.0 <11.0.0': ^10.5.0
  'minimatch@>=3.0.0 <4.0.0': ^3.1.5
  'minimatch@>=9.0.0 <10.0.0': ^9.0.9
  'ajv@>=6.0.0 <7.0.0': ^6.15.0
  'ajv@>=8.0.0 <9.0.0': ^8.20.0
  'flatted@>=3.0.0 <4.0.0': ^3.4.4
  'brace-expansion@>=1.0.0 <2.0.0': ^1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': ^2.1.7
  'picomatch@>=2.0.0 <3.0.0': ^2.3.2
  'picomatch@>=4.0.0 <5.0.0': ^4.0.7
  'js-yaml@>=4.0.0 <5.0.0': ^4.3.2
  'fast-uri@>=3.0.0 <4.0.0': ^3.1.9
  'postcss-selector-parser@>=6.0.0 <7.0.0': ^6.1.5
  'browserslist@>=4.0.0 <5.0.0': ^4.29.5
  'baseline-browser-mapping@>=2.0.0 <3.0.0': ^2.11.35
  'tmp@>=0.2.0 <0.3.0': ^0.2.6
  'tmp@<0.2.4': ^0.2.6
  'serialize-javascript@<7.0.3': ^7.1.3
